<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 3</title>
</head>
<body>
    <script>
        function rute(n, edges, start, end) {
            if (start === end) {
                return 0;
            }
            let graph = Array.from({ length: n }, () => []);
            for (let edge of edges) {
                let a = edge[0];
                let b = edge[1];
                graph[a].push(b);
                graph[b].push(a);
            }
            let queue = [[start, 0]];
            let visited = new Set();
            visited.add(start);
            while (queue.length > 0) {
                let [lokasi, jarak] = queue.shift();
                for (let tetangga of graph[lokasi]) {
                    if (!visited.has(tetangga)) {
                        if (tetangga === end) {
                            return jarak + 1;
                        }
                        visited.add(tetangga);
                        queue.push([tetangga, jarak + 1]);
                    }
                }
            }
            return -1;
        }
        console.log(rute(6, [[0,1], [0,2], [1,3], [2,3], [3,4]], 0, 4));  
        console.log(rute(6, [[0,1], [0,2], [0,3], [1,3], [2,3], [3,4]], 0, 4));  
        console.log(rute(8, [[0,1], [0,2], [1,5], [2,6], [5,3], [6,7], [7,3], [3,4]], 0, 4));  
    </script>
</body>
</html>
