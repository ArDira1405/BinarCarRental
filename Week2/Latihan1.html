<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan1</title>
</head>
<body>
    <script>
        console.log("====2 barang=====")
        function duabarang(nums,target){
            for(let i = 0;i < nums.length; i++){
                for(let j = i + 1; j < nums.length; j++){
                    if(nums[i] + nums[j] == target){
                        return([i,j])
                    }
                }
            }
            return null;
        }
        console.log(duabarang([2, 58, 4, 7, 3], 6));
        console.log(duabarang([2, 58, 4, 7, 3], 9));
        console.log(duabarang([2, 58, 4, 7, 3], 60));
        
        console.log("====3 barang=====")
        function tigabarang(nums,hasil){
            for(let i = 0; i < nums.length; i++){
                for(let j = 1 + 1; j < nums.length; j++){
                    for(let k = i + 2; k < nums.length; k++){
                        if(nums[i] + nums[j] + nums[k] == hasil){
                            return([i,j,k])
                        }
                    }
                }
            }
        }
        console.log(tigabarang([2,6,3,9,5,1,7,4,6,3], 15));
        
        console.log("====4 barang=====")
        function empatbarang(nums,tujuan){
            for(let i = 0; i < nums.length; i++){
                for(let j = i + 1; j < nums.length; j++){
                    for(let k = 1 + 2; k < nums.length; k++){
                        for(let l = 1 + 3; l < nums.length; l++){
                            if(nums[i] + nums[j] + nums[k] + nums[l] == tujuan){
                                return([i,j,k,l])
                            }
                        }
                    }
                }
            }
        }
        console.log(empatbarang([6,3,8,2,9,1,3,5,8,4], 24))
    </script>

</body>
</html>
