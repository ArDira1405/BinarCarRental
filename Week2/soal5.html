<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>soal5</title>
</head>
<body>
    <script>
        const dataPenjualanNovel = [
            {
                idProduct: 'BOOK002421',
                namaProduk: 'Pulang - Pergi',
                penulis: 'Tere Liye',
                hargaBeli: 60000,
                hargaJual: 86000,
                totalTerjual: 150,
                sisaStok: 17,
            },
            {
                idProduct: 'BOOK002351',
                namaProduk: 'Selamat Tinggal',
                penulis: 'Tere Liye',
                hargaBeli: 75000,
                hargaJual: 103000,
                totalTerjual: 171,
                sisaStok: 20,
            },
            {
                idProduct: 'BOOK002941',
                namaProduk: 'Garis Waktu',
                penulis: 'Fiersa Besari',
                hargaBeli: 67000,
                hargaJual: 99000,
                totalTerjual: 213,
                sisaStok: 5,
            },
            {
                idProduct: 'BOOK002941',
                namaProduk: 'Laskar Pelangi',
                penulis: 'Andrea Hirata',
                hargaBeli: 55000,
                hargaJual: 68000,
                totalTerjual: 20,
                sisaStok: 56,
            },
        ];
        function getInfoPenjualan(dataPenjualan) {

            if (!Array.isArray(dataPenjualan)) {
                return "Error: Invalid data type";
            }

            let totalModal = 0;
            let totalJual = 0;
            let produkTerlaris = dataPenjualan[0];
            
            let penjualanPenulis = {};

            for (let i = 0; i < dataPenjualan.length; i++) {

                totalModal += dataPenjualan[i].hargaBeli * dataPenjualan[i].totalTerjual;

                totalJual += dataPenjualan[i].hargaJual * dataPenjualan[i].totalTerjual;

                if (dataPenjualan[i].totalTerjual > produkTerlaris.totalTerjual) {
                    produkTerlaris = dataPenjualan[i];
                }

                const penulis = dataPenjualan[i].penulis;

                if (penjualanPenulis[penulis] === undefined) {
                    penjualanPenulis[penulis] = 0;
                }

                penjualanPenulis[penulis] += dataPenjualan[i].totalTerjual;
            }

            const totalKeuntungan = totalJual - totalModal;

            const persentaseKeuntungan =
                (totalKeuntungan / totalModal) * 100;

            let penulisTerlaris;
            let jumlahTerjualTerbanyak = 0;

            for (const penulis in penjualanPenulis) {
                if (penjualanPenulis[penulis] > jumlahTerjualTerbanyak) {
                    jumlahTerjualTerbanyak = penjualanPenulis[penulis];
                    penulisTerlaris = penulis;
                }
            }

            return {
                totalKeuntungan: 'Rp. ' + totalKeuntungan.toLocaleString('id-ID'),
                totalModal: 'Rp. ' + totalModal.toLocaleString('id-ID'),
                persentaseKeuntungan: persentaseKeuntungan.toFixed(2) + '%',
                produkBukuTerlaris: produkTerlaris.namaProduk,
                penulisTerlaris: penulisTerlaris
            };
        }

        console.log(getInfoPenjualan(dataPenjualanNovel));
    </script>
</body>
</html>
