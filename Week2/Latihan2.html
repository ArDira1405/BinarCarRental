<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function cekKurung(s){
            let stack = [];

            for(let i = 0; i < s.length ; i++){
                let karakter = s[i];

                if(karakter === "(" || karakter === "[" || karakter === "{"){
                    stack.push(karakter);
                } else{
                    let terakhir = stack.pop();

                    if(
                        (karakter === ')' && terakhir !== '(') ||
                        (karakter === ']' && terakhir !== '[') ||
                        (karakter === '}' && terakhir !== '{')
                    ){
                        return false
                    }
                }
            }

            return stack.length === 0;
        }
        console.log(cekKurung("()()()"))
        console.log(cekKurung("(](){})"))
        console.log(cekKurung("({()})"))
        console.log(cekKurung("([)]"))
    </script>
</body>
</html>
